<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pokémon</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>PokeDashboard</h1>
        <p>Explorador de Pokémon en Tiempo Real</p>
    </header>

    <main class="container">
        <section class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Escribe el nombre de un Pokémon...">
                <button id="searchBtn">Buscar</button>
                <button id="clearBtn" class="btn-secondary">Restablecer</button>
            </div>
        </section>

        <div id="statusMessage" class="status-message hidden"></div>

        <section id="pokemonGrid" class="pokemon-grid">
            </section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
